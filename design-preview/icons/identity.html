<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Baton — Identity System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #101114; width: 3400px; font-family: -apple-system, "Inter", "PingFang SC", sans-serif; }
  .header { display: flex; justify-content: space-between; align-items: baseline; padding: 70px 80px 40px; }
  .header h1 { color: #f7f8f8; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
  .header .sub { color: #6f747e; font-size: 18px; letter-spacing: 4px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1053px); gap: 24px; padding: 0 80px 80px; }
  .panel { background: #16171b; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
           height: 780px; position: relative; overflow: hidden; }
  .panel .tag { position: absolute; left: 28px; bottom: 22px; color: #5f646e; font-size: 15px;
                letter-spacing: 3px; font-weight: 600; text-transform: uppercase; }
  .panel .num { position: absolute; right: 28px; bottom: 22px; color: #3d4149; font-size: 15px; }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.05; z-index: 50; }

  /* mark tile reused across panels */
  .tile { border-radius: 22.7%; position: relative; overflow: hidden; }
</style>
</head>
<body>
<svg class="grain" width="3400" height="2600" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="1"/>
</svg>

<div class="header">
  <h1>Baton — Identity System</h1>
  <div class="sub">IDENTITY / V1 · 09 PANELS</div>
</div>

<div class="grid">
  <!-- 1 LOGO COVER -->
  <div class="panel" id="panel-cover">
    <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px;">
      <svg class="tile mark-master" id="mark" width="620" height="620" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cv-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#232637"/>
            <stop offset="48%" stop-color="#1a1c2b"/>
            <stop offset="100%" stop-color="#14151f"/>
          </linearGradient>
          <linearGradient id="cv-sweep" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="cv-glow" cx="68%" cy="72%" r="70%">
            <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#5e6ad2" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1024" height="1024" fill="url(#cv-tile)"/>
        <rect width="1024" height="1024" fill="url(#cv-glow)"/>
        <rect width="1024" height="1024" fill="url(#cv-sweep)"/>
        <!-- punched ❯ : recessed well + bevel -->
        <path d="M362 240 L636 512 L362 784" fill="none" stroke="#0a0b10" stroke-width="158"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M362 240 L636 512 L362 784" fill="none" stroke="#05060a" stroke-width="158"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.55" transform="translate(0 10)"/>
        <path d="M362 232 L628 500" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"
              stroke-linecap="round" transform="translate(-6 -4)"/>
      </svg>
      <div style="color:#f7f8f8; font-size:52px; font-weight:700; letter-spacing:14px;">BATON</div>
    </div>
    <div class="tag">Logo</div><div class="num">01</div>
  </div>

  <!-- 2 CONSTRUCTION -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#131418"/>
      <g transform="translate(376,90)" opacity="0.9">
        <circle cx="150" cy="300" r="220" fill="none" stroke="#2c2f3a" stroke-width="2"/>
        <circle cx="330" cy="300" r="220" fill="none" stroke="#2c2f3a" stroke-width="2"/>
        <circle cx="240" cy="300" r="300" fill="none" stroke="#2c2f3a" stroke-width="2"/>
        <line x1="105" y1="60" x2="390" y2="545" stroke="#3a3e4c" stroke-width="2"/>
        <line x1="105" y1="540" x2="390" y2="55" stroke="#3a3e4c" stroke-width="2"/>
        <line x1="0" y1="300" x2="480" y2="300" stroke="#3a3e4c" stroke-width="2"/>
        <path d="M170 110 L370 300 L170 490" fill="none" stroke="#7170ff" stroke-width="56"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="105" cy="60" r="10" fill="#7170ff"/>
        <circle cx="390" cy="545" r="10" fill="#7170ff"/>
      </g>
      <text x="60" y="700" fill="#5f646e" font-size="17" letter-spacing="2" font-family="-apple-system">CONSTRUCTED FROM TWO CIRCLES · 45° AXIS · R = 1.46R</text>
    </svg>
    <div class="tag">Construction</div><div class="num">02</div>
  </div>

  <!-- 3 DIGITAL APPLICATION -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#101116"/>
      <!-- app icon large -->
      <g transform="translate(90,110)">
        <rect width="340" height="340" rx="77" fill="#1a1c2b"/>
        <path d="M120 80 L245 205 L120 330" fill="none" stroke="#0a0b10" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="90" y="540" fill="#8a8f98" font-size="20" font-family="-apple-system">APP ICON · 1024</text>
      <!-- browser tab -->
      <g transform="translate(560,110)">
        <rect x="0" y="60" width="403" height="66" rx="14" fill="#1d1f26"/>
        <circle cx="36" cy="93" r="17" fill="#1a1c2b"/>
        <path d="M28 85 L40 97 L28 109" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="66" y="100" fill="#c9cdf5" font-size="21" font-family="-apple-system">Baton — Agents</text>
      </g>
      <text x="560" y="540" fill="#8a8f98" font-size="20" font-family="-apple-system">BROWSER · 32PX</text>
      <!-- command line -->
      <g transform="translate(90,620)">
        <rect width="873" height="90" rx="18" fill="#14151a"/>
        <text x="34" y="56" fill="#a78bfa" font-size="26" font-family="Menlo, monospace">❯</text>
        <text x="70" y="56" fill="#6f747e" font-size="26" font-family="Menlo, monospace">baton spawn --agents 4</text>
      </g>
    </svg>
    <div class="tag">Digital Application</div><div class="num">03</div>
  </div>

  <!-- 4 ESSENCE -->
  <div class="panel">
    <div style="position:absolute; inset:0; display:flex; align-items:center; padding-left:80px;">
      <div>
        <div style="color:#f7f8f8; font-size:76px; font-weight:700; letter-spacing:-1px; line-height:1.15;">Wield<br/>every agent.</div>
        <div style="color:#6f747e; font-size:22px; margin-top:28px; letter-spacing:0.5px;">One prompt. Many hands.</div>
      </div>
    </div>
    <div class="tag">Essence</div><div class="num">04</div>
  </div>

  <!-- 5 COLOR -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#131418"/>
      <rect x="80" y="90" width="270" height="270" rx="24" fill="#5e6ad2"/>
      <rect x="390" y="90" width="270" height="270" rx="24" fill="#7170ff"/>
      <rect x="700" y="90" width="270" height="270" rx="24" fill="#a78bfa"/>
      <rect x="80" y="420" width="270" height="270" rx="24" fill="#08090a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
      <rect x="390" y="420" width="270" height="270" rx="24" fill="#1a1c2b"/>
      <rect x="700" y="420" width="270" height="270" rx="24" fill="#f7f8f8"/>
      <text x="80" y="740" fill="#5f646e" font-size="18" font-family="Menlo, monospace">#5E6AD2</text>
      <text x="390" y="740" fill="#5f646e" font-size="18" font-family="Menlo, monospace">#7170FF</text>
      <text x="700" y="740" fill="#5f646e" font-size="18" font-family="Menlo, monospace">#A78BFA</text>
    </svg>
    <div class="tag">Color</div><div class="num">05</div>
  </div>

  <!-- 6 TYPOGRAPHY -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#131418"/>
      <text x="80" y="330" fill="#f7f8f8" font-size="300" font-weight="700" font-family="-apple-system, 'Inter'">Aa</text>
      <text x="80" y="470" fill="#5f646e" font-size="20" font-family="-apple-system">INTER VARIABLE · CV01 SS03 · 400/510/590</text>
      <text x="80" y="620" fill="#8a8f98" font-size="44" font-family="Menlo, monospace">mono 0123 ❯</text>
      <text x="80" y="700" fill="#5f646e" font-size="20" font-family="-apple-system">JETBRAINS MONO · MACHINE DATA</text>
    </svg>
    <div class="tag">Typography</div><div class="num">06</div>
  </div>

  <!-- 7 PHYSICAL -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#101116"/>
      <g transform="translate(140,120)">
        <rect width="380" height="380" rx="86" fill="#1a1c2b"/>
        <path d="M134 90 L258 214 L134 338" fill="none" stroke="#0a0b10" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(600,140)">
        <rect width="300" height="300" rx="150" fill="#1a1c2b"/>
        <path d="M106 70 L230 194 L106 318" fill="none" stroke="#0a0b10" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="140" y="600" fill="#5f646e" font-size="19" font-family="-apple-system">HOME SCREEN</text>
      <text x="600" y="600" fill="#5f646e" font-size="19" font-family="-apple-system">ADAPTIVE · CIRCLE MASK</text>
    </svg>
    <div class="tag">Application</div><div class="num">07</div>
  </div>

  <!-- 8 IMAGE DIRECTION -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="im-g1" cx="30%" cy="20%" r="90%">
          <stop offset="0%" stop-color="#2a2d3f"/><stop offset="100%" stop-color="#0c0d10"/>
        </radialGradient>
        <linearGradient id="im-g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#5e6ad2" stop-opacity="0.7"/><stop offset="100%" stop-color="#7170ff" stop-opacity="0.15"/>
        </linearGradient>
      </defs>
      <rect width="1053" height="780" fill="url(#im-g1)"/>
      <ellipse cx="700" cy="520" rx="420" ry="260" fill="url(#im-g2)" opacity="0.5"/>
      <ellipse cx="300" cy="200" rx="260" ry="160" fill="#a78bfa" opacity="0.12"/>
      <path d="M420 640 L700 360" stroke="#f7f8f8" stroke-opacity="0.8" stroke-width="30" stroke-linecap="round"/>
      <circle cx="724" cy="336" r="42" fill="#0c0d10"/>
      <circle cx="724" cy="336" r="30" fill="#828fff"/>
    </svg>
    <div class="tag">Image Direction</div><div class="num">08</div>
  </div>

  <!-- 9 SYSTEM DETAIL -->
  <div class="panel">
    <svg width="1053" height="780" viewBox="0 0 1053 780" xmlns="http://www.w3.org/2000/svg">
      <rect width="1053" height="780" fill="#131418"/>
      <g transform="translate(80,110)">
        <rect width="420" height="92" rx="20" fill="#1a1c2b"/>
        <circle cx="46" cy="46" r="10" fill="#3fb950"/>
        <text x="80" y="56" fill="#e6e9f4" font-size="24" font-family="-apple-system">claude-code</text>
        <text x="330" y="56" fill="#6f747e" font-size="22" font-family="-apple-system">running</text>
      </g>
      <g transform="translate(80,230)">
        <rect width="420" height="92" rx="20" fill="#1a1c2b"/>
        <circle cx="46" cy="46" r="10" fill="#7170ff"/>
        <text x="80" y="56" fill="#e6e9f4" font-size="24" font-family="-apple-system">codex</text>
        <text x="330" y="56" fill="#6f747e" font-size="22" font-family="-apple-system">thinking</text>
      </g>
      <g transform="translate(80,350)">
        <rect width="420" height="92" rx="20" fill="#1a1c2b"/>
        <circle cx="46" cy="46" r="10" fill="#6f747e"/>
        <text x="80" y="56" fill="#e6e9f4" font-size="24" font-family="-apple-system">opencode</text>
        <text x="330" y="56" fill="#6f747e" font-size="22" font-family="-apple-system">idle</text>
      </g>
      <g transform="translate(580,110)">
        <rect width="393" height="92" rx="20" fill="#1a1c2b"/>
        <text x="34" y="58" fill="#a78bfa" font-size="30" font-family="Menlo, monospace">❯</text>
        <text x="72" y="58" fill="#6f747e" font-size="26" font-family="Menlo, monospace">_</text>
      </g>
      <g transform="translate(580,230)">
        <rect width="393" height="92" rx="20" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
        <circle cx="46" cy="46" r="22" fill="none" stroke="#f7f8f8" stroke-width="10"
                stroke-dasharray="104 34" transform="rotate(-60 46 46)"/>
      </g>
      <text x="80" y="700" fill="#5f646e" font-size="18" font-family="-apple-system">STATUS CHIPS · PROMPT BAR · SPINNER — ALL FROM THE ❯ GEOMETRY</text>
    </svg>
    <div class="tag">System Detail</div><div class="num">09</div>
  </div>
</div>

<!-- pinned master for capture: ?t=mark -->
<script>
if (new URLSearchParams(location.search).get('t') === 'mark') {
  document.querySelectorAll('.header, .grid, .grain').forEach(el => el.style.display = 'none');
  const m = document.getElementById('mark');
  m.style.position = 'fixed';
  m.style.left = '0';
  m.style.top = '0';
  m.style.width = '1024px';
  m.style.height = '1024px';
  m.style.borderRadius = '0';
  m.style.zIndex = '99';
  document.body.appendChild(m);
  document.body.style.padding = '0';
}
</script>
</body>
</html>
