<!-- BRIEF: "Tether" — your pocket device (small cyan orb) stays linked to a powerful agent (large violet orb)
     by one glowing cord. Glossy shaded spheres on graphite. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1e27"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="h-cord" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="h-small" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="h-big" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <filter id="h-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#h-bg)"/>
  <path id="cord-glow" d="M300 740 C 300 520, 700 540, 700 320" fill="none" stroke="url(#h-cord)"
        stroke-width="60" stroke-linecap="round" opacity="0.7" filter="url(#h-blur)"/>
  <path id="cord" d="M300 740 C 300 520, 700 540, 700 320" fill="none" stroke="url(#h-cord)"
        stroke-width="36" stroke-linecap="round"/>
  <circle id="device" cx="300" cy="740" r="82" fill="url(#h-small)"/>
  <circle id="agent" cx="700" cy="320" r="132" fill="url(#h-big)"/>
</svg>
