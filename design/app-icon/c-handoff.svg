<!-- BRIEF: Baton app icon, concept C "Handoff". Double chevron ">>" = pass the baton forward / fast-forward
     control of a running agent. Rear chevron dim indigo, front chevron coral->amber. Near-black background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <linearGradient id="c-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#ffc24b"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#c-bg)"/>
  <path id="rear" d="M292 300 L500 512 L292 724" fill="none" stroke="#6366f1" stroke-opacity="0.6"
        stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="front" d="M524 300 L732 512 L524 724" fill="none" stroke="url(#c-front)"
        stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
