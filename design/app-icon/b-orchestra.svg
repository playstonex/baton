<!-- BRIEF: Baton app icon, concept B "Orchestra". Center ">_" prompt = the host daemon; an orbit ring with
     three coloured nodes = the agents it conducts (Claude Code / Codex / Kiro …). Deep indigo background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="1" stop-color="#0a0b14"/>
    </linearGradient>
    <linearGradient id="b-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97362"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#b-bg)"/>
  <circle id="orbit" cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="22"/>
  <path id="orbit-active" d="M705 282 A300 300 0 0 1 742 705" fill="none" stroke="url(#b-arc)"
        stroke-width="22" stroke-linecap="round"/>
  <g id="prompt" fill="none" stroke="#f5f7fa" stroke-linecap="round" stroke-linejoin="round">
    <path d="M396 418 L490 512 L396 606" stroke-width="64"/>
  </g>
  <rect id="cursor" x="530" y="574" width="120" height="44" rx="22" fill="#f5f7fa"/>
  <g id="agents">
    <circle cx="705" cy="282" r="54" fill="#f97362"/>
    <circle cx="742" cy="705" r="46" fill="#a78bfa"/>
    <circle cx="212" cy="512" r="40" fill="#e5e7eb"/>
  </g>
</svg>
